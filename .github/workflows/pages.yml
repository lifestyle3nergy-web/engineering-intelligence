name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Render atlas to HTML
        run: |
          mkdir -p _site/assets
          cp assets/wiki.css _site/assets/wiki.css
          pandoc wiki.md \
            --from=gfm \
            --to=html5 \
            --standalone \
            --toc \
            --toc-depth=3 \
            --metadata title="Internet Engineering Evolution Atlas" \
            --css=assets/wiki.css \
            --output=_site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
